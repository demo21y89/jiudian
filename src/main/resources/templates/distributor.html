<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>分销商工作台 — AgriTrace</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<nav class="topnav"><a href="/page" class="topnav-brand"><div class="bi">🌾</div>AgriTrace</a><div class="topnav-links"><span style="font-weight:600;color:#a0680a;font-size:14px">🚚 分销商工作台</span><button onclick="$.logout()" style="background:none;border:none;cursor:pointer;color:#a3957c;font-size:12px">退出</button></div></nav>
<div style="max-width:1100px;margin:0 auto;padding:24px">
<div class="tabs"><button class="tab-btn active" data-tab="dash">数据概览</button><button class="tab-btn" data-tab="orders">订单管理</button><button class="tab-btn" data-tab="logistics">物流追踪</button></div>

<div data-tab-content="dash">
<div class="stat-row"><div class="stat-box"><div class="sv" id="d1">—</div><div class="sl">待处理订单</div></div><div class="stat-box"><div class="sv" id="d2">—</div><div class="sl">运输中</div></div><div class="stat-box"><div class="sv" id="d3">—</div><div class="sl">已完成</div></div><div class="stat-box"><div class="sv" id="d4">—</div><div class="sl">总交易额（元）</div></div></div>
<div class="card"><div style="font-weight:600;font-size:14px;margin-bottom:14px">📋 全部订单</div><div class="tbl-wrap"><table><thead><tr><th>订单编号</th><th>商品</th><th>数量</th><th>金额</th><th>状态</th></tr></thead><tbody id="do"></tbody></table></div></div>
</div>

<div data-tab-content="orders" class="hidden"><div class="tbl-wrap"><table><thead><tr><th>订单编号</th><th>商品</th><th>数量</th><th>金额</th><th>收货地址</th><th>状态</th></tr></thead><tbody id="dol"></tbody></table></div></div>

<div data-tab-content="logistics" class="hidden">
<div style="display:flex;gap:8px;margin-bottom:18px"><input type="text" class="form-input" id="lcode" placeholder="输入订单编号查询物流" style="max-width:360px"><button class="btn btn-primary" onclick="queryLogistics()">查询物流</button></div>
<div style="position:relative;padding-left:28px"><div style="position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,#d4920e,#2d5a27)"></div><div id="ltime"></div></div>
</div>
</div>
<script src="/js/app.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{if(!$.loggedIn()){window.location.href="/page/login";return}try{let d=await $.get("/orders"),o=$.extractList(d);document.getElementById("d1").textContent=o.filter(x=>x.status==="PENDING"||x.status==="待付款").length;document.getElementById("d2").textContent=o.filter(x=>x.status==="SHIPPED"||x.status==="运输中").length;document.getElementById("d3").textContent=o.filter(x=>x.status==="COMPLETED"||x.status==="已完成").length;document.getElementById("d4").textContent="¥"+o.reduce((s,x)=>s+(x.totalPrice||0),0).toFixed(2);let r=x=>'<tr><td style="font-family:monospace;font-size:11px">'+x.orderNo+'</td><td>商品#'+x.productId+'</td><td>'+x.quantity+'</td><td style="font-weight:600">¥'+(x.totalPrice||0).toFixed(2)+'</td><td><span class="badge '+(x.status==="COMPLETED"?"badge-success":"badge-warning")+'">'+(x.status||"处理中")+'</span></td></tr>';document.getElementById("do").innerHTML=o.length?o.map(r).join(""):'<tr><td colspan="5" class="text-center text-muted">暂无订单</td></tr>';document.getElementById("dol").innerHTML=o.length?o.map(x=>'<tr><td style="font-family:monospace;font-size:11px">'+x.orderNo+'</td><td>商品#'+x.productId+'</td><td>'+x.quantity+'</td><td style="font-weight:600">¥'+(x.totalPrice||0).toFixed(2)+'</td><td>'+(x.shippingAddress||"—")+'</td><td><span class="badge badge-warning">'+(x.status||"处理中")+'</span></td></tr>').join(""):'<tr><td colspan="6" class="text-center text-muted">暂无订单</td></tr>'}catch(e){Toast.err(e.message)}});
function queryLogistics(){let c=document.getElementById("lcode").value.trim();if(!c){Toast.err("请输入订单编号");return}document.getElementById("ltime").innerHTML='<div style="position:relative;margin-bottom:20px"><div style="position:absolute;left:-24px;top:2px;width:12px;height:12px;border-radius:50%;border:2.5px solid #d4920e;background:#d4920e;z-index:1"></div><div style="font-size:13px;font-weight:600">📦 已揽件</div><div style="font-size:12px;color:#6b5e4a">产地仓库出库 — 操作人：物流部</div><div style="font-size:11px;color:#a3957c">2026-07-14 08:30</div></div><div style="position:relative;margin-bottom:20px"><div style="position:absolute;left:-24px;top:2px;width:12px;height:12px;border-radius:50%;border:2.5px solid #d4920e;background:#d4920e;z-index:1"></div><div style="font-size:13px;font-weight:600">🚚 冷链运输中</div><div style="font-size:12px;color:#6b5e4a">当前温度4.2℃，位置：济南中转站</div><div style="font-size:11px;color:#a3957c">2026-07-14 12:00</div></div><div style="position:relative;margin-bottom:20px"><div style="position:absolute;left:-24px;top:2px;width:12px;height:12px;border-radius:50%;border:2.5px solid rgba(180,160,130,.3);background:#fff;z-index:1"></div><div style="font-size:13px;font-weight:600">📍 到达配送站</div><div style="font-size:12px;color:#6b5e4a">预计明日送达目的地</div><div style="font-size:11px;color:#a3957c">预计 2026-07-15</div></div>'}
</script></body></html>
