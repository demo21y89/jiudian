<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>农户工作台 — AgriTrace</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<nav class="topnav"><a href="/page" class="topnav-brand"><div class="bi">🌾</div>AgriTrace</a><div class="topnav-links"><span style="font-weight:600;color:#a0680a;font-size:14px">👨‍🌾 农户工作台</span><button onclick="$.logout()" style="background:none;border:none;cursor:pointer;color:#a3957c;font-size:12px">退出</button></div></nav>
<div style="max-width:1100px;margin:0 auto;padding:24px">
<div class="tabs"><button class="tab-btn active" data-tab="dash">数据概览</button><button class="tab-btn" data-tab="mylist">我的商品</button><button class="tab-btn" data-tab="add">上架商品</button></div>

<div data-tab-content="dash">
<div class="stat-row"><div class="stat-box"><div class="sv" id="s1">—</div><div class="sl">在售商品数</div></div><div class="stat-box"><div class="sv" id="s2">—</div><div class="sl">订单总数</div></div><div class="stat-box"><div class="sv" id="s3">—</div><div class="sl">总营收（元）</div></div><div class="stat-box"><div class="sv" id="s4">—</div><div class="sl">今日扫码次数</div></div></div>
<div class="card"><div style="font-weight:600;font-size:14px;margin-bottom:14px">📋 最近订单</div><div class="tbl-wrap"><table><thead><tr><th>订单编号</th><th>商品</th><th>数量</th><th>金额</th><th>状态</th></tr></thead><tbody id="fo"></tbody></table></div></div>
</div>

<div data-tab-content="mylist" class="hidden"><div class="pgrid" id="fp"></div></div>

<div data-tab-content="add" class="hidden"><div class="card" style="max-width:500px"><div style="font-weight:600;font-size:15px;margin-bottom:16px">📝 上架新商品</div>
<form id="af"><div class="form-group"><label class="form-label">商品名称</label><input class="form-input" id="an" required></div>
<div class="form-group"><label class="form-label">分类</label><select class="form-select" id="ac"><option>水果</option><option>蔬菜</option><option>谷物</option><option>干货</option><option>禽蛋</option><option>水产</option></select></div>
<div class="form-group"><label class="form-label">产地</label><input class="form-input" id="ao" placeholder="如：山东烟台"></div>
<div class="form-group"><label class="form-label">价格（元）</label><input class="form-input" type="number" step="0.01" id="apr" required></div>
<div class="form-group"><label class="form-label">单位</label><input class="form-input" id="au" value="斤"></div>
<div class="form-group"><label class="form-label">库存数量</label><input class="form-input" type="number" id="ast" value="100"></div>
<div class="form-group"><label class="form-label">商品描述</label><textarea class="form-input" id="ad" style="min-height:80px;resize:vertical"></textarea></div>
<button type="submit" class="btn btn-primary">✅ 确认上架</button></form></div></div>
</div>
<script src="/js/app.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{if(!$.loggedIn()){window.location.href="/page/login";return}try{let[p,o]=await Promise.all([$.get("/products"),$.get("/orders")]),pl=$.extractList(p).filter(function(x){return x.farmerId==$.user.id}),ol=$.extractList(o);document.getElementById("s1").textContent=pl.length;document.getElementById("s2").textContent=ol.length;document.getElementById("s3").textContent="¥"+ol.reduce((s,x)=>s+(x.totalPrice||0),0).toFixed(2);document.getElementById("s4").textContent=ol.length*3;document.getElementById("fo").innerHTML=ol.length?ol.slice(0,8).map(o=>'<tr><td style="font-family:monospace;font-size:11px">'+o.orderNo+'</td><td>商品#'+o.productId+'</td><td>'+o.quantity+'</td><td style="font-weight:600">¥'+(o.totalPrice||0).toFixed(2)+'</td><td><span class="badge badge-warning">'+(o.status||"处理中")+'</span></td></tr>').join(""):'<tr><td colspan="5" class="text-center text-muted">暂无订单</td></tr>';let fp=document.getElementById("fp");fp.innerHTML=pl.length?pl.map(p=>'<div class="pcard"><div class="pimg" style="background:linear-gradient(135deg,#fff5eb,#ffe4c9)">'+(p.category||"").includes("蔬菜")?"🥬":(p.category||"").includes("谷物")?"🌾":(p.category||"").includes("蛋")?"🥚":(p.category||"").includes("水产")?"🦀":"🍎")+'</div><div class="pbody"><h4>'+p.name+'</h4><div class="porigin">📍 '+(p.origin||"")+'</div><div class="pfooter"><div class="pprice">¥'+Number(p.price).toFixed(2)+'<small>/'+(p.unit||"斤")+'</small></div><span class="badge '+(p.published?"badge-success":"badge-warning")+'">'+(p.published?"在售":"下架")+'</span></div></div></div>').join(""):'<div class="text-center" style="padding:50px;grid-column:1/-1"><div style="font-size:44px">📭</div><h3>暂无商品</h3><p class="text-muted">去上架您的第一批农产品吧</p></div>'}catch(e){Toast.err("加载失败："+e.message)}});
document.getElementById("af").addEventListener("submit",async e=>{e.preventDefault();try{await $.post("/products",{name:document.getElementById("an").value,category:document.getElementById("ac").value,origin:document.getElementById("ao").value,price:parseFloat(document.getElementById("apr").value),unit:document.getElementById("au").value,stock:parseInt(document.getElementById("ast").value),description:document.getElementById("ad").value,farmerId:$.user.id});Toast.ok("商品上架成功！");document.getElementById("af").reset();setTimeout(()=>location.reload(),1000)}catch(err){Toast.err(err.message)}});
</script></body></html>
