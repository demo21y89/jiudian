<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理后台 — AgriTrace</title><link rel="stylesheet" href="/css/app.css"></head>
<body>
<nav class="topnav"><a href="/page" class="topnav-brand"><div class="bi">🌾</div>AgriTrace</a><div class="topnav-links"><span style="font-weight:600;color:#a0680a;font-size:14px">⚙️ 系统管理</span><button onclick="$.logout()" style="background:none;border:none;cursor:pointer;color:#a3957c;font-size:12px">退出</button></div></nav>
<div style="max-width:1100px;margin:0 auto;padding:24px">
<div class="tabs"><button class="tab-btn active" data-tab="dash">数据总览</button><button class="tab-btn" data-tab="users">用户管理</button><button class="tab-btn" data-tab="products">商品管理</button><button class="tab-btn" data-tab="orders">订单管理</button><button class="tab-btn" data-tab="traces">溯源记录</button></div>

<div data-tab-content="dash">
<div class="stat-row"><div class="stat-box"><div class="sv" id="adu">—</div><div class="sl">注册用户</div></div><div class="stat-box"><div class="sv" id="adp">—</div><div class="sl">在售商品</div></div><div class="stat-box"><div class="sv" id="ado">—</div><div class="sl">总订单数</div></div><div class="stat-box"><div class="sv" id="adt">—</div><div class="sl">溯源记录</div></div></div>
<div class="card"><div style="font-weight:600;font-size:14px;margin-bottom:12px">📊 系统运行状态</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;font-size:13px"><div><b>后端框架</b><br><span class="text-muted">Spring Boot 3.3</span></div><div><b>AI引擎</b><br><span class="text-muted">DeepSeek API</span></div><div><b>MCP技能</b><br><span class="text-muted">6个核心Skill</span></div><div><b>数据库</b><br><span class="text-muted">H2 / MySQL</span></div></div></div>
</div>

<div data-tab-content="users" class="hidden"><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>用户名</th><th>昵称</th><th>角色</th><th>手机</th><th>注册时间</th></tr></thead><tbody id="aut"></tbody></table></div></div>
<div data-tab-content="products" class="hidden"><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>产地</th></tr></thead><tbody id="apt"></tbody></table></div></div>
<div data-tab-content="orders" class="hidden"><div class="tbl-wrap"><table><thead><tr><th>订单编号</th><th>商品</th><th>数量</th><th>金额</th><th>状态</th><th>时间</th></tr></thead><tbody id="aot"></tbody></table></div></div>
<div data-tab-content="traces" class="hidden"><div class="tbl-wrap"><table><thead><tr><th>溯源码</th><th>商品名称</th><th>产地</th><th>合格证</th><th>扫码次数</th><th>区块链</th></tr></thead><tbody id="att"></tbody></table></div></div>
</div>
<script src="/js/app.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{if(!$.loggedIn()){window.location.href="/page/login";return}try{let[ud,pd,od]=await Promise.all([$.get("/users"),$.get("/products"),$.get("/orders")]),u=$.extractList(ud),p=$.extractList(pd),o=$.extractList(od);document.getElementById("adu").textContent=u.length;document.getElementById("adp").textContent=p.length;document.getElementById("ado").textContent=o.length;try{let td=await $.get("/trace/list");document.getElementById("adt").textContent=$.extractList(td).length}catch(e){document.getElementById("adt").textContent="—"}document.getElementById("aut").innerHTML=u.map(x=>'<tr><td>'+x.id+'</td><td>'+x.username+'</td><td>'+(x.nickname||"—")+'</td><td><span class="badge badge-info">'+x.role+'</span></td><td>'+(x.phone||"—")+'</td><td>'+x.createTime+'</td></tr>').join("");document.getElementById("apt").innerHTML=p.map(x=>'<tr><td>'+x.id+'</td><td>'+x.name+'</td><td>'+(x.category||"—")+'</td><td>¥'+Number(x.price).toFixed(2)+'</td><td>'+x.stock+'</td><td>'+(x.origin||"—")+'</td></tr>').join("");document.getElementById("aot").innerHTML=o.map(x=>'<tr><td style="font-family:monospace;font-size:11px">'+x.orderNo+'</td><td>商品#'+x.productId+'</td><td>'+x.quantity+'</td><td style="font-weight:600">¥'+(x.totalPrice||0).toFixed(2)+'</td><td><span class="badge badge-warning">'+(x.status||"处理中")+'</span></td><td style="font-size:11px;color:#a3957c">'+x.createTime+'</td></tr>').join("");try{let td=await $.get("/trace/list"),tl=$.extractList(td);document.getElementById("att").innerHTML=tl.length?tl.map(x=>'<tr><td style="font-family:monospace;font-size:11px">'+x.traceCode+'</td><td>'+x.productName+'</td><td>'+x.origin+'</td><td><span class="badge '+(x.certValid?"badge-success":"badge-danger")+'">'+(x.certValid?"有效":"无效")+'</span></td><td>'+x.scanCount+'次</td><td>'+(x.txHash?"<span class=\"badge badge-info\">已上链</span>":"—")+'</td></tr>').join(""):'<tr><td colspan="6" class="text-center text-muted">暂无</td></tr>'}catch(e){document.getElementById("att").innerHTML='<tr><td colspan="6" class="text-center text-muted">加载失败</td></tr>'}}catch(e){Toast.err("加载失败："+e.message)}});
</script></body></html>
