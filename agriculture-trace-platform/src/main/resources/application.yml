server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${DB_PATH:data/trace.db}
    driver-class-name: org.sqlite.JDBC
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: AgriTracePlatform2026SecretKeyForJWTTokenGeneration
  expiration: 86400000

# AI 联网配置
ai:
  model:
    api-key: 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
    model-name: deepseek/deepseek-chat
    base-url: https://openrouter.ai/api/v1
    provider: openai
  rag:
    top-k: 5
    similarity-threshold: 0.7