server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${DB_PATH:data/trace.db}
    driver-class-name: org.sqlite.JDBC
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: AgriTracePlatform2026SecretKeyForJWTTokenGeneration
  expiration: 86400000

# ============================================
# AI 联网配置
# ============================================
# 支持以下 AI 供应商:
#   - openai:    https://api.openai.com
#   - deepseek:  https://api.deepseek.com
#   - dashscope: https://dashscope.aliyuncs.com (通义千问)
#   - custom:    自定义 base-url
#
# 配置方式（三选一）:
# 1. 修改下方 api-key 的值
# 2. 设置环境变量 AI_API_KEY
# 3. 启动时传参 --ai.model.api-key=sk-xxx
# ============================================
ai:
  model:
    api-key: ${AI_API_KEY:sk-your-api-key}
    model-name: ${AI_MODEL:gpt-4o-mini}
    base-url: ${AI_BASE_URL:}
    provider: ${AI_PROVIDER:openai}
  rag:
    top-k: 5
    similarity-threshold: 0.7
